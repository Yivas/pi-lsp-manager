name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 22.19.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            architecture: x64
          - os: macos-14
            platform: darwin
            architecture: arm64
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Set up the gate Python interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run deterministic suite
        run: npm test
      - name: Verify and record compatibility row
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node -e 'const os=require("node:os"); const actual={platform:os.platform(),release:os.release(),architecture:os.arch(),node:process.version}; console.log(JSON.stringify(actual)); if(actual.platform!==process.env.EXPECTED_PLATFORM||actual.architecture!==process.env.EXPECTED_ARCHITECTURE) process.exit(1)'
          npm ls --depth=0 @earendil-works/pi-coding-agent typescript-language-server typescript @vue/language-server vue
          npm ls --all @vue/typescript-plugin
      - name: Run real TypeScript Language Server fixture
        run: npm test -- test/real-servers/typescript-language-server.test.ts
        env:
          RUN_REAL_LSP: "1"
      - name: Verify the locked Vue installation through the coordinator
        shell: bash
        run: |
          # Keep the gate outside the checkout so missing transitive packages cannot resolve from its node_modules. The coordinator installs and verifies the pinned closure once; the fixture below reuses that installation, and the final cleanup step removes this exact directory.
          gate_root="${RUNNER_TEMP:-/tmp}/vue-install-gate"
          rm -rf -- "$gate_root"
          mkdir -p "$gate_root"
          echo "VUE_INSTALL_GATE_ROOT=$gate_root" >> "$GITHUB_ENV"
          VUE_INSTALL_GATE_ROOT="$gate_root" VUE_INSTALL_GATE_OUTPUT="$gate_root/cli-path.txt" RUN_REAL_VUE_INSTALL=1 npm test -- test/real-servers/vue-install-gate.test.ts
          # $GITHUB_ENV only reaches later steps, so this step passes the CLI inline
          # and the coexistence step reads the export below.
          test -s "$gate_root/cli-path.txt"
          vue_cli="$(cat "$gate_root/cli-path.txt")"
          echo "VUE_CLI=$vue_cli" >> "$GITHUB_ENV"
          VUE_CLI="$vue_cli" VUE_CLI_REQUIRED=1 RUN_REAL_VUE=1 npm test -- test/real-servers/vue-language-server.test.ts
      - name: Verify locked Tailwind installation and real Tailwind fixture
        shell: bash
        run: |
          # Keep the gate outside the checkout so missing transitive packages cannot resolve from its node_modules. The coexistence fixture below reuses this installation, and the final cleanup step removes this exact directory.
          gate="${RUNNER_TEMP:-/tmp}/tailwindcss-gate"
          rm -rf -- "$gate"
          mkdir -p "$gate"
          echo "TAILWIND_GATE_ROOT=$gate" >> "$GITHUB_ENV"
          cp -R test/real-servers/gates/tailwindcss/. "$gate/"
          (cd "$gate" && npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --userconfig=./npmrc --globalconfig=./global-npmrc --cache=./cache)
          # $GITHUB_ENV only reaches later steps, so this step passes the CLI inline
          # and the coexistence step reads the export below.
          tailwind_cli="$(node -p 'require("node:path").resolve(process.argv[1], "node_modules/@tailwindcss/language-server/bin/tailwindcss-language-server")' "$gate")"
          echo "TAILWIND_CLI=$tailwind_cli" >> "$GITHUB_ENV"
          RUN_REAL_TAILWIND=1 TAILWIND_CLI="$tailwind_cli" npm test -- test/real-servers/tailwindcss.test.ts
      - name: Run the real Vue and Tailwind coexistence fixture
        run: npm test -- test/real-servers/vue-tailwind-coexistence.test.ts
        env:
          RUN_REAL_VUE: "1"
          RUN_REAL_TAILWIND: "1"
          VUE_CLI_REQUIRED: "1"
      - name: Verify locked Python installations through the coordinator
        timeout-minutes: 10
        shell: bash
        env:
          PYTHON_GATE_INTERPRETER: ${{ steps.python.outputs.python-path }}
        run: |
          # A fresh unique root per run: the gate refuses to reuse or reset a root another
          # writer owns, so no retained local handoff is ever touched. The interpreter is the
          # exact version provisioned above for this ephemeral test host; production never
          # installs Python and instead requires the trusted global interpreter field.
          gate_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/python-install-gate.XXXXXX")"
          echo "PYTHON_INSTALL_GATE_ROOT=$gate_root" >> "$GITHUB_ENV"
          PYTHON_INSTALL_GATE_ROOT="$gate_root" \
            PYTHON_INSTALL_GATE_OUTPUT="$gate_root/handoff.json" \
            RUN_REAL_PYTHON_INSTALL=1 \
            npm test -- test/real-servers/python-install-gate.test.ts
          # The manifest is the read-only handoff for a later semantic fixture; this lote
          # proves the run, keeps the path for the cleanup step, and starts no Ty/Ruff LSP.
          test -s "$gate_root/handoff.json"
          node -e '
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          if (manifest.status !== "complete") throw new Error(`gate manifest is ${manifest.status}`);
          for (const id of ["ty", "ruff"]) {
            const server = manifest.servers?.[id];
            if (!server || server.phase !== "ready") throw new Error(`gate ${id} is not ready`);
            if (!server.executable.path.startsWith(manifest.root)) throw new Error(`gate ${id} escaped the owned root`);
          }
          console.log("python-install-gate complete: ty,ruff");
          ' "$gate_root/handoff.json"
          echo "PYTHON_INSTALL_GATE_HANDOFF=$gate_root/handoff.json" >> "$GITHUB_ENV"
      - name: Remove the gate installations
        if: always()
        shell: bash
        run: |
          # Exact owned directories recorded by the gate steps; no globs.
          for gate in "$VUE_INSTALL_GATE_ROOT" "$TAILWIND_GATE_ROOT" "$PYTHON_INSTALL_GATE_ROOT"; do
            if [ -n "$gate" ]; then rm -rf -- "$gate"; fi
          done
      - name: Audit locked dependencies
        run: npm run audit:check
      - name: Inspect package contents
        run: npm run pack:check
      - name: Install and load the packed extension in isolation
        shell: bash
        run: |
          tarball=$(npm pack --silent)
          package_path="$GITHUB_WORKSPACE/$tarball"
          isolated=$(mktemp -d)
          cd "$isolated"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$package_path" >/dev/null
          test -f node_modules/pi-lsp-manager/docs/security-model.md
          ./node_modules/.bin/pi --no-extensions --extension ./node_modules/pi-lsp-manager/src/index.ts --list-models >/dev/null
          rm -rf "$isolated" "$package_path"
