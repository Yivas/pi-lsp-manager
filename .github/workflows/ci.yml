name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 22.19.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            architecture: x64
          - os: macos-14
            platform: darwin
            architecture: arm64
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run deterministic suite
        run: npm test
      - name: Verify and record compatibility row
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node -e 'const os=require("node:os"); const actual={platform:os.platform(),release:os.release(),architecture:os.arch(),node:process.version}; console.log(JSON.stringify(actual)); if(actual.platform!==process.env.EXPECTED_PLATFORM||actual.architecture!==process.env.EXPECTED_ARCHITECTURE) process.exit(1)'
          npm ls --depth=0 @earendil-works/pi-coding-agent typescript-language-server typescript @vue/language-server vue
          npm ls --all @vue/typescript-plugin
      - name: Run real TypeScript Language Server fixture
        run: npm test -- test/real-servers/typescript-language-server.test.ts
        env:
          RUN_REAL_LSP: "1"
      - name: Verify locked Vue installation and real Vue fixture
        shell: bash
        run: |
          # Keep the gate outside the checkout so missing transitive packages cannot resolve from its node_modules.
          gate=$(mktemp -d "${RUNNER_TEMP:-/tmp}/vue-install-gate.XXXXXX")
          trap 'rm -rf -- "$gate"' EXIT
          node --input-type=module - "$gate" <<'EOF'
          import { resolve } from 'node:path';
          import { VUE_RECIPE } from './src/install/catalog.ts';
          import { prepareControlledNpmFiles } from './src/install/launch.ts';
          await prepareControlledNpmFiles(resolve(process.argv[2]), VUE_RECIPE);
          EOF
          (cd "$gate" && npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --userconfig=./npmrc --globalconfig=./global-npmrc --cache=./cache)
          VUE_CLI=$(node -p 'require("node:path").resolve(process.argv[1], "node_modules/@vue/language-server/bin/vue-language-server.js")' "$gate")
          RUN_REAL_VUE=1 VUE_CLI="$VUE_CLI" npm test -- test/real-servers/vue-language-server.test.ts
      - name: Verify locked Tailwind installation and real Tailwind fixture
        shell: bash
        run: |
          # Keep the gate outside the checkout so missing transitive packages cannot resolve from its node_modules.
          gate=$(mktemp -d "${RUNNER_TEMP:-/tmp}/tailwindcss-gate.XXXXXX")
          trap 'rm -rf -- "$gate"' EXIT
          cp -R test/real-servers/gates/tailwindcss/. "$gate/"
          (cd "$gate" && npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --userconfig=./npmrc --globalconfig=./global-npmrc --cache=./cache)
          TAILWIND_CLI=$(node -p 'require("node:path").resolve(process.argv[1], "node_modules/@tailwindcss/language-server/bin/tailwindcss-language-server")' "$gate")
          RUN_REAL_TAILWIND=1 TAILWIND_CLI="$TAILWIND_CLI" npm test -- test/real-servers/tailwindcss.test.ts
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - name: Inspect package contents
        run: npm run pack:check
      - name: Install and load the packed extension in isolation
        shell: bash
        run: |
          tarball=$(npm pack --silent)
          package_path="$GITHUB_WORKSPACE/$tarball"
          isolated=$(mktemp -d)
          cd "$isolated"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$package_path" >/dev/null
          test -f node_modules/pi-lsp-manager/docs/security-model.md
          ./node_modules/.bin/pi --no-extensions --extension ./node_modules/pi-lsp-manager/src/index.ts --list-models >/dev/null
          rm -rf "$isolated" "$package_path"
